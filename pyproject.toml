[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docforge"
version = "1.0.0"
description = "AI-assisted editorial publishing platform for transforming DOCX documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DocForge" }]
keywords = ["docx", "publishing", "ai", "editorial", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "Pillow>=10.3",
    "openai>=1.30",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "typer[all]>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
docforge = "docforge.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-python-jose>=3.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",    # typer.Argument/Option in defaults is the documented Typer API
    "RUF001",  # intentional non-ASCII chars (en-dash in tables, French non-breaking spaces)
]

[tool.ruff.lint.isort]
known-first-party = ["docforge"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Strict mode for core domain logic; relax for I/O-heavy adapters
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["docforge"]
omit = ["docforge/cli/*", "tests/*"]

[tool.coverage.report]
fail_under = 90
